.a{transform-box:fill-box;transform-origin:center}
@keyframes scan{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
@keyframes shake{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-3px) rotate(-5deg)}75%{transform:translateY(-3px) rotate(5deg)}}
@keyframes altA{0%,44%{opacity:1}50%,94%{opacity:0}100%{opacity:1}}
@keyframes altB{0%,44%{opacity:0}50%,94%{opacity:1}100%{opacity:0}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
