<svg xmlns="http://www.w3.org/2000/svg" width="640" height="428" viewBox="0 0 640 428" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.a{transform-box:fill-box;transform-origin:center}
@keyframes scan{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
@keyframes shake{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-3px) rotate(-5deg)}75%{transform:translateY(-3px) rotate(5deg)}}
@keyframes altA{0%,44%{opacity:1}50%,94%{opacity:0}100%{opacity:1}}
@keyframes altB{0%,44%{opacity:0}50%,94%{opacity:1}100%{opacity:0}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
@keyframes blink{0%,88%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(1.5px)}}
@keyframes z1{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes z2{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes droop{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.8)}}
@keyframes drop{0%{transform:translateY(-2px);opacity:0}20%,80%{opacity:1}100%{transform:translateY(9px);opacity:0}}
.scan{animation:scan 1.3s ease-in-out infinite}.slow{animation:scan 4s ease-in-out infinite}
.shake{animation:shake .9s ease-in-out infinite}
.altA{animation:altA 1.6s steps(1,end) infinite}.altB{animation:altB 1.6s steps(1,end) infinite}
.hop{animation:hop 1.5s ease-in-out infinite}.blink{animation:blink 5s ease-in-out infinite}
.breathe{animation:breathe 3.2s ease-in-out infinite}
.z1{animation:z1 2.4s ease-in-out infinite}.z2{animation:z2 2.4s ease-in-out infinite}
.droop{animation:droop 2.6s ease-in-out infinite}.drop{animation:drop 1.6s ease-in infinite}
