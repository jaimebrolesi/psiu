.droop{animation:droop 2.6s ease-in-out infinite}.drop{animation:drop 1.6s ease-in infinite}
.peek{animation:peek 5s ease-in-out infinite}.slow2{animation:scan26 4s ease-in-out infinite}.blink2{animation:blink2 5s linear infinite}
